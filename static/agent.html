<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuminaForge · 智能体出图</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --line:#e6e8ef; --text:#1b1f2a; --muted:#6b7280;
    --accent:#4f46e5; --accent-soft:#eef2ff; --ok:#059669; --warn:#b45309; --err:#dc2626;
    --shadow:0 1px 3px rgba(17,24,39,.06),0 8px 24px rgba(17,24,39,.05);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#a855f7);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
  header h1{margin:0;font-size:18px;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  .ghost-btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;
    padding:6px 12px;font-size:13px;cursor:pointer}
  .ghost-btn:hover{background:var(--accent-soft);border-color:#c7d2fe}

  /* 控制条 */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0 4px}
  .ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;
    font-size:13px;color:var(--text);cursor:pointer}

  /* 对话流 */
  .stream{flex:1;overflow-y:auto;padding:16px 0 8px}
  .bubble-user{align-self:flex-end;background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;
    padding:10px 14px;max-width:78%;margin:10px 0 10px auto;width:fit-content;font-size:14.5px}
  .turn{margin:0 0 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:10px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .card img{width:100%;display:block;background:#eef0f5;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in}
  .card .body{padding:12px 13px 13px}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .tag{font-size:11.5px;padding:2.5px 8px;border-radius:999px;background:var(--accent-soft);
    color:#4338ca;border:1px solid #dbe0ff}
  .tag.gray{background:#f3f4f6;color:#4b5563;border-color:#e5e7eb}
  .tag.green{background:#ecfdf5;color:#047857;border-color:#c6f0dc}
  .dims{display:flex;flex-direction:column;gap:4px;margin:8px 0 10px}
  .dim{display:flex;gap:8px;font-size:12.5px;line-height:1.45}
  .dim b{flex:0 0 40px;color:var(--muted);font-weight:600}
  .dim span{color:#374151;word-break:break-word}
  .note{font-size:12.5px;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;
    border-radius:8px;padding:7px 9px;margin-bottom:10px}
  .meta{font-size:11.5px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:7px;flex-wrap:wrap}
  .acts button,.acts a{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;
    font-size:12.5px;cursor:pointer;color:var(--text);text-decoration:none;display:inline-block}
  .acts button:hover,.acts a:hover{background:var(--accent-soft);border-color:#c7d2fe}
  .acts button:disabled{opacity:.55;cursor:progress}
  .vidslot:empty{display:none}
  .vidslot video{width:100%;display:block;border-radius:9px;margin:8px 0 6px;background:#000}
  .vprog{font-size:12.5px;color:#4338ca;background:var(--accent-soft);border:1px solid #dbe0ff;
    border-radius:8px;padding:8px 10px;margin:8px 0}
  .vmeta{font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .vmeta a{border:1px solid var(--line);border-radius:7px;padding:3px 8px;text-decoration:none;color:var(--text);margin-left:6px}

  .progress{background:var(--panel);border:1px dashed #c7d2fe;border-radius:14px;padding:14px;
    font-size:13.5px;color:#4338ca}
  .progress .bar{height:5px;background:#e0e7ff;border-radius:999px;margin-top:9px;overflow:hidden}
  .progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
  .err{background:#fef2f2;border:1px solid #fecaca;color:var(--err);border-radius:10px;padding:10px 12px;font-size:13px}

  /* 输入区 */
  .composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 16px;border-top:1px solid var(--line)}
  .composer .row{display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:14.5px;line-height:1.55;max-height:140px;background:#fff;color:var(--text);
    font-family:inherit;outline:none}
  textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
  .send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 20px;
    font-size:14.5px;cursor:pointer;font-weight:600;height:44px}
  .send:disabled{opacity:.5;cursor:not-allowed}
  .hint{font-size:11.5px;color:var(--muted);margin-top:7px}

  /* 历史抽屉 */
  .drawer{position:fixed;top:0;right:0;width:380px;max-width:92vw;height:100vh;background:#fff;
    border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(17,24,39,.10);transform:translateX(100%);
    transition:transform .25s;z-index:40;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .drawer .list{flex:1;overflow-y:auto;padding:12px 16px}
  .hitem{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f2f6}
  .hitem img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
  .hitem .info{font-size:12.5px;color:var(--muted);min-width:0;flex:1}
  .hitem .info .ins{color:var(--text);font-size:13px;font-weight:600;margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 0}

  /* 图片放大 */
  .lightbox{position:fixed;inset:0;background:rgba(17,24,39,.82);display:none;place-items:center;z-index:60;cursor:zoom-out}
  .lightbox.show{display:grid}
  .lightbox img{max-width:92vw;max-height:92vh;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">L</div>
    <div>
      <h1>智能体出图</h1>
      <div class="sub">一句指令，变出不一样的画 · 11 维差异引擎</div>
    </div>
    <div class="spacer"></div>
    <button class="ghost-btn" id="btnHistory">历史记录</button>
  </header>

  <div class="controls">
    <label class="ctl">画风
      <select id="style"><option value="auto">🎲 随机（每张不同）</option></select>
    </label>
    <label class="ctl">比例
      <select id="ratio">
        <option value="1:1" selected>1:1 方图</option>
        <option value="9:16">9:16 竖屏</option>
        <option value="16:9">16:9 横屏</option>
        <option value="3:2">3:2 横构图</option>
        <option value="2:3">2:3 竖构图</option>
        <option value="4:3">4:3</option>
      </select>
    </label>
    <label class="ctl">视频
      <select id="vq">
        <option value="fast" selected>快速（约 15~17 分钟，原生分辨率不超分）</option>
        <option value="full">完整（约 18~20 分钟，补帧+4x超分）</option>
      </select>
    </label>
    <label class="ctl">张数
      <select id="count">
        <option value="1" selected>1 张</option>
        <option value="2">2 张（互不相同）</option>
        <option value="4">4 张（互不相同）</option>
      </select>
    </label>
  </div>

  <div class="stream" id="stream">
    <div class="empty" id="emptyTip">输入一句画面描述，例如「一只橘猫在雨中弹吉他」<br>同一句指令连点几次，每次出的图都不一样。</div>
  </div>

  <div class="composer">
    <div class="row">
      <textarea id="input" rows="1" placeholder="描述你想要的画面…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">生成</button>
    </div>
    <div class="hint">用户明确写死的属性（主体/颜色/数量/地点）会被保留，其余维度由创意总监自由发挥。</div>
  </div>
</div>

<div class="drawer" id="drawer">
  <header><b>历史记录</b><div class="spacer"></div><button class="ghost-btn" id="closeDrawer">关闭</button></header>
  <div class="list" id="historyList"></div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script>
const $ = s => document.querySelector(s);
const stream = $('#stream'), input = $('#input'), sendBtn = $('#send');
let busy = false;

/* ── 初始化风格包 ── */
fetch('/api/agent-image/styles').then(r=>r.json()).then(d=>{
  (d.styles||[]).forEach(s=>{
    const o = document.createElement('option');
    o.value = s.key; o.textContent = s.zh + ' · ' + s.ckpt.replace('.safetensors','');
    $('#style').appendChild(o);
  });
}).catch(()=>{});

/* ── 自适应高度 ── */
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
sendBtn.onclick = send;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function send(){
  if(busy) return;
  const text = input.value.trim();
  if(!text) return;
  $('#emptyTip')?.remove();
  busy = true; sendBtn.disabled = true; input.value=''; input.style.height='auto';

  const turn = document.createElement('div'); turn.className='turn';
  const ub = document.createElement('div'); ub.className='bubble-user'; ub.textContent=text;
  const grid = document.createElement('div'); grid.className='grid';
  const prog = document.createElement('div'); prog.className='progress';
  prog.innerHTML = '<div>🎨 创意总监正在拆解画面…</div><div class="bar"><i></i></div>';
  turn.append(ub, grid, prog);
  stream.appendChild(turn); stream.scrollTop = stream.scrollHeight;

  const total = +$('#count').value;
  try{
    const resp = await fetch('/api/agent-image/generate',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({instruction:text, variants:total,
                            style:$('#style').value, ratio:$('#ratio').value})
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf='';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for(const ln of lines){
        if(!ln.trim()) continue;
        let ev; try{ ev = JSON.parse(ln) }catch(e){ continue }
        if(ev.type==='spec'){
          prog.querySelector('div').textContent = `🎨 第 ${ev.index}/${ev.total} 张 · ${styleZh(ev.style)} · 正在拆解画面规格…`;
          prog.querySelector('i').style.width = ((ev.index-0.5)/ev.total*100)+'%';
        }else if(ev.type==='submit'){
          prog.querySelector('div').textContent = `🖼 第 ${ev.index}/${ev.total} 张 · 正在采样…`;
        }else if(ev.type==='done'){
          const rec = ev.record; if(rec) grid.appendChild(card(rec));
          prog.querySelector('i').style.width = (ev.index/ev.total*100)+'%';
          stream.scrollTop = stream.scrollHeight;
        }else if(ev.type==='error'){
          const e=document.createElement('div'); e.className='err'; e.textContent='生成失败：'+ev.error; turn.appendChild(e);
        }
      }
    }
  }catch(e){
    const el=document.createElement('div'); el.className='err'; el.textContent='请求失败：'+e.message; turn.appendChild(el);
  }
  prog.remove();
  busy=false; sendBtn.disabled=false; input.focus();
}

let STYLES={};
fetch('/api/agent-image/styles').then(r=>r.json()).then(d=>{(d.styles||[]).forEach(s=>STYLES[s.key]=s.zh)}).catch(()=>{});
function styleZh(k){return STYLES[k]||k}

function card(r){
  const el = document.createElement('div'); el.className='card';
  const dims = Object.entries(r.dims||{}).map(([k,v])=>
    `<div class="dim"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('');
  el.innerHTML = `
    <img src="${r.url}" alt="加载中" loading="lazy" data-full="${r.url}">
    <div class="body">
      <div class="tagrow">
        <span class="tag">${esc(r.style_zh||'')}</span>
        <span class="tag gray">${esc(r.ratio||'')} · ${r.width}×${r.height}</span>
        <span class="tag gray">${esc(String(r.checkpoint||'').replace('.safetensors',''))}</span>
        <span class="tag ${r.source==='llm'?'green':'gray'}">${r.source==='llm'?'创意总监':'本地启发式'}</span>
      </div>
      ${r.variation_note?`<div class="note">💡 ${esc(r.variation_note)}</div>`:''}
      <div class="dims">${dims}</div>
      <div class="meta">seed ${r.seed} · ${r.steps}步 cfg${r.cfg} · ${esc(r.sampler)}/${esc(r.scheduler)} · ${r.elapsed}s · ${Math.round((r.size_bytes||0)/1024)}KB</div>
      <div class="vidslot"></div>
      <div class="acts">
        <button data-act="video">🎬 生成视频</button>
        <button data-act="reroll">🎲 再来一张</button>
        <button data-act="same">🎯 同风格再来</button>
        <button data-act="copy">📋 复制提示词</button>
        <a href="${r.url}" download="luminaforge_${r.seed}.png">⬇ 下载</a>
      </div>
    </div>`;
  el.querySelector('img').onclick = e=>{ $('#lightboxImg').src=e.target.dataset.full; $('#lightbox').classList.add('show') };
  el.querySelector('[data-act="video"]').onclick = async e=>{
    const btn=e.target, slot=el.querySelector('.vidslot');
    const fast = ($('#vq') && $('#vq').value==='fast');
    btn.disabled=true; btn.textContent='⏳ 生成中…';
    slot.innerHTML=`<div class="vprog">🎬 正在生成视频（Wan 2.2 真视频，${fast?'快速模式约 15~17':'完整模式约 18~20'} 分钟）…<br>
      <span style="color:#6b7280">8G 显存加载 5B 模型 + 采样 72 帧很慢，请耐心等待，期间可继续出图</span></div>`;
    try{
      const resp=await fetch('/api/agent-image/video',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:r.id,prompt:r.prompt,ratio:r.ratio,duration:3,seed:r.seed,negative:r.negative,fast})});
      const reader=resp.body.getReader(), dec=new TextDecoder(); let buf='';
      while(true){
        const {done,value}=await reader.read(); if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop();
        for(const ln of lines){
          if(!ln.trim()) continue;
          let ev; try{ ev=JSON.parse(ln) }catch(_){ continue }
          if(ev.type==='video'){
            const txt = ev.stage==='wan5b' ? 'Wan 2.2 真视频采样中' : '真视频失败，降级为推拉镜头';            slot.innerHTML=`<div class="vprog">🎬 ${txt}… <br><span style="color:#6b7280">${esc(String(ev.detail||'').slice(0,90))}</span></div>`;
          }else if(ev.type==='done'){
            slot.innerHTML=`<video src="${ev.url}" controls loop muted playsinline></video>
              <div class="vmeta">${String(ev.mode||'').startsWith('wan5b')?'真视频（画面会动）':'降级：镜头推拉（画面不动）'} ·
              ${esc(ev.engine)} · ${ev.elapsed}s · ${Math.round((ev.size_bytes||0)/1024)}KB
              <a href="${ev.url}" download="${r.seed}.mp4">⬇ 下载视频</a></div>`;
            btn.textContent='✅ 已生成';
          }else if(ev.type==='error'){
            slot.innerHTML=`<div class="err">视频生成失败：${esc(ev.error)}</div>`;
            btn.disabled=false; btn.textContent='🎬 重试';
          }
        }
      }
    }catch(err){
      slot.innerHTML=`<div class="err">请求失败：${esc(err.message)}</div>`;
      btn.disabled=false; btn.textContent='🎬 重试';
    }
  };
  el.querySelector('[data-act="reroll"]').onclick = ()=>{ input.value=r.instruction; $('#style').value='auto'; send() };
  el.querySelector('[data-act="same"]').onclick  = ()=>{ input.value=r.instruction; $('#style').value=r.style; send() };
  el.querySelector('[data-act="copy"]').onclick  = async e=>{
    try{ await navigator.clipboard.writeText(r.prompt); e.target.textContent='✅ 已复制';
         setTimeout(()=>e.target.textContent='📋 复制提示词',1600);}catch(_){}
  };
  return el;
}

$('#lightbox').onclick = ()=>$('#lightbox').classList.remove('show');

/* ── 历史抽屉 ── */
$('#btnHistory').onclick = async ()=>{
  $('#drawer').classList.add('open');
  const list = $('#historyList'); list.innerHTML='<div class="empty">加载中…</div>';
  try{
    const d = await (await fetch('/api/agent-image/history?limit=60')).json();
    const items = d.items||[];
    if(!items.length){ list.innerHTML='<div class="empty">还没有生成记录</div>'; return }
    list.innerHTML='';
    items.forEach(r=>{
      const it=document.createElement('div'); it.className='hitem';
      it.innerHTML = `<img src="${r.url}" loading="lazy" data-full="${r.url}">
        <div class="info"><div class="ins">${esc(r.instruction)}</div>
        <div>${esc(r.style_zh)} · ${esc(r.ratio)} · seed ${r.seed}</div>
        <div>${esc(r.created_at||'')} ${r.video_url?'· 有视频':''}</div></div>`;
      it.querySelector('img').onclick=e=>{$('#lightboxImg').src=e.target.dataset.full;$('#lightbox').classList.add('show')};
      list.appendChild(it);
    });
  }catch(e){ list.innerHTML='<div class="empty">加载失败</div>' }
};
$('#closeDrawer').onclick = ()=>$('#drawer').classList.remove('open');
</script>
</body>
</html>
