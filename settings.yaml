# novel-to-video-codex 工业化配置（设计文档 docs/INDUSTRIALIZATION.md §2.4）
engines:
  cloud:
    video_mode: local         # 用户选定：仅本地，Wan 2.2 TI2V-5B（首帧忠实、离线可跑）
    priority: [seedance_ark, kling_official, minimax, jimeng, grok,
               fal_kling, fal_seedance, fal_minimax, runway, veo]
    max_cost_per_clip_usd: 1.0
    timeout_seconds: 900
  local:
    local_kind: wan5b        # comfyui(LTX) | wan(A14B) | wan5b(TI2V-5B，当前生产引擎)
                             # 32G 显存已可改 wan（Wan2.2-A14B）获更高画质，需先备 A14B 权重
    checkpoint: ltx-2.3-22b-dev-fp8.safetensors
    text_encoder: gemma_3_12B_it_fpmixed.safetensors
    quality: high            # normal|high（high=96帧/4s；步数恒 8+3，蒸馏模型加步数有害）
    width: 960               # 32G 放开（8GB 期间曾降至 672）
    height: 1728             # 32G 放开（8GB 期间曾降至 1152）
    frames: 96               # 32G 放开：恢复质量甜点（8GB 期间降至 65）
                             # 注：960×1728×96 约 staging 23GB，8GB 卡会卡死，32G 可容纳
    fps: 24

quality:
  min_duration_ratio: 0.8
  min_frames: 24
  min_file_size: 10000
  face_similarity: 0.5
  max_retries: 2
  retry_strategy: [reseed, switch_engine, rewrite_prompt]

queue:
  max_concurrency: 2
  budget_usd: 10.0
  resume: true

subtitles:
  style: ass
  timing: line_accurate     # line_accurate | even_split

